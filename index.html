<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brenda Campos | Dados, Sistemas & IA</title>
<meta name="description" content="Portfólio de Brenda Campos: Analista de Dados e Sistemas, com foco em IA, agentes, automações e integrações.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#fbfbfa; --surface:#ffffff; --soft:#f4f4f2; --line:#e8e8e4;
  --txt:#16161a; --mut:#5f5f67; --faint:#737379;
  --acc:#5b4ff0; --acc-soft:#efedfe;
  --body:#45454c; --body2:#3d3d44; --hover:#cfcfc9; --navbg:rgba(251,251,250,.8);
  --on-txt:#ffffff; --pri-hover:#2b2b31; --now-bg:#dcfce7; --now-fg:#15803d;
  --contact:#16161a; --contact-mut:#a9a9b2;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0e0e11; --surface:#16161b; --soft:#1f1f26; --line:#2a2a32;
  --txt:#ededf0; --mut:#a8a8b2; --faint:#8a8a94;
  --acc:#8b80ff; --acc-soft:#25223f;
  --body:#c4c4cc; --body2:#d0d0d6; --hover:#3a3a44; --navbg:rgba(14,14,17,.8);
  --on-txt:#0e0e11; --pri-hover:#d4d4da; --now-bg:#14301f; --now-fg:#4ade80;
  --contact:#1a1a21; --contact-mut:#9a9aa4;
  color-scheme:dark;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{transition:background .25s,color .25s;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mono{font-family:"JetBrains Mono",monospace}

/* nav */
nav{position:sticky;top:0;z-index:10;background:var(--navbg);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.sc{border-color:var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:28px;height:64px}
.logo{font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo .tagline{font-weight:400;color:var(--faint);font-size:.85rem;margin-left:-2px}
.logo{white-space:nowrap}
nav ul a{white-space:nowrap}
@media(max-width:1260px){.logo .tagline{display:none}}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--txt);color:var(--on-txt);display:grid;place-items:center;font-style:normal;font-size:.8rem}
nav ul{display:flex;gap:4px;list-style:none}
nav ul a{color:var(--mut);font-size:.88rem;font-weight:500;padding:7px 12px;border-radius:99px;transition:.15s}
nav ul a:hover{color:var(--txt);background:var(--soft)}
.ctrls{display:flex;align-items:center;gap:6px;margin-left:10px}
.langs{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.langs button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:.74rem;font-weight:600;padding:7px 10px;min-height:32px;border-radius:99px;cursor:pointer;letter-spacing:.03em}
.langs button[aria-pressed="true"]{background:var(--soft);color:var(--txt)}
.tbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--mut);display:grid;place-items:center;cursor:pointer}
.tbtn:hover{color:var(--txt)}
.tbtn .ic{width:16px;height:16px}
.tbtn .sun{display:none}
[data-theme="dark"] .tbtn .sun{display:block}
[data-theme="dark"] .tbtn .moon{display:none}
.navr{display:flex;align-items:center}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--txt);color:var(--on-txt);padding:10px 16px;border-radius:10px;font-weight:600;transition:top .15s}
.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
summary:focus-visible{outline-offset:-2px}
.mbtn{display:none}
.nar{position:fixed;left:18px;bottom:18px;z-index:40;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--txt);font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.nar:hover{border-color:var(--hover)}
.nar[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.nar .ic{width:17px;height:17px}
.nar[hidden]{display:none}
.sh h2,.ah,.contact h2{display:inline-block;vertical-align:middle}
.contact .lsn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}
.lsn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--mut);cursor:pointer;vertical-align:middle;margin-left:12px;transition:.15s}
.lsn:hover{color:var(--acc);border-color:var(--hover)}
.lsn .ic{width:16px;height:16px}
.lsn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lsn[hidden]{display:none}
@media(max-width:920px){
  nav ul{display:none}
  .mbtn{display:grid}
  nav ul.open{display:flex;flex-direction:column;position:absolute;top:60px;right:16px;left:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
  nav ul.open a{display:block;padding:12px 14px;font-size:1rem}
}

/* hero */
.hero{padding:96px 0 80px}
.avail{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:500;color:var(--mut);background:var(--surface);border:1px solid var(--line);padding:6px 14px 6px 10px;border-radius:99px;margin-bottom:28px}
.avail i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #dcfce7}
.hero h1{font-size:clamp(2.4rem,6.4vw,4.2rem);font-weight:700;letter-spacing:-.045em;line-height:1.04;margin-bottom:22px}
.hero h1 span{color:var(--faint)}
.lead{font-size:1.15rem;color:var(--mut);max-width:600px;margin-bottom:34px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--surface);transition:.18s}
.btn:hover{border-color:var(--hover);transform:translateY(-1px)}
.btn.pri{background:var(--txt);color:var(--on-txt);border-color:var(--txt)}
.btn.pri:hover{background:var(--pri-hover)}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:38px;color:var(--mut);font-size:.9rem}
.meta span{display:flex;align-items:center;gap:7px}

/* sections */
section{padding:80px 0}
.sh{margin-bottom:36px}
.eyebrow{font-size:.78rem;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.12em}
.sh h2{font-size:clamp(1.7rem,3.5vw,2.3rem);letter-spacing:-.035em;margin-top:8px;font-weight:700}
.sh p{color:var(--mut);margin-top:10px;max-width:620px}

.about{display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:start}
.about p{color:var(--body2);font-size:1.02rem;margin-bottom:14px}
.ah{font-size:clamp(1.7rem,3.5vw,2.3rem);letter-spacing:-.035em;margin:8px 0 18px}
.photo{background:#000;border-radius:24px;overflow:hidden;aspect-ratio:432/577;position:sticky;top:90px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:820px){.about{grid-template-columns:1fr;gap:28px}.photo{position:static;max-width:320px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:36px}
@media(max-width:560px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stat b{font-size:1.9rem;letter-spacing:-.04em;display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:.85rem}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.skill h3{font-size:.95rem;font-weight:600;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:500;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--body)}
.chip.acc{background:var(--acc-soft);color:var(--acc)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;margin-bottom:16px}
.card-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.card h3{font-size:1.3rem;letter-spacing:-.025em;font-weight:700}
.when{font-size:.8rem;color:var(--faint);white-space:nowrap;font-weight:500;padding-top:5px}
.sum{color:var(--mut);margin:10px 0 16px;max-width:720px}
.badge{font-style:normal;display:inline-block;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:99px;margin-left:10px;vertical-align:middle;background:var(--acc-soft);color:var(--acc);letter-spacing:.01em}
.badge.now{background:var(--now-bg);color:var(--now-fg)}

/* experiência */
.company{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.clogo{width:92px;height:64px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:8px;flex-shrink:0}
.clogo img{max-width:100%;max-height:100%;object-fit:contain}
.company small{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:.85rem}
.tl2{position:relative;margin-top:22px}
.tl2::before{content:"";position:absolute;left:171px;top:10px;bottom:10px;width:1px;background:var(--line)}
.trole{position:relative}
.trole > summary,.trole > .thead{display:grid;grid-template-columns:160px 24px 1fr 20px;align-items:start;gap:0;padding:10px 0;cursor:pointer;list-style:none;border-radius:12px}
.trole > summary::-webkit-details-marker{display:none}
.trole > .thead{cursor:default}
.tdate{font-size:.82rem;color:var(--mut);font-weight:500;text-align:right;padding-right:14px;line-height:1.4}
.tdate small{display:block;color:var(--faint);font-size:.75rem;font-weight:400}
.tdot{width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--hover);margin:4px 0 0 6px;position:relative;z-index:1}
.trole.now .tdot{border-color:var(--acc);background:var(--acc)}
.tbody h4{font-size:1rem;font-weight:600;line-height:1.35}
.tcount{font-size:.8rem;color:var(--acc);font-weight:500}
.tcount .c,.trole[open] .tcount .o{display:none}
.trole[open] .tcount .c{display:inline}
.trole > summary:hover .tbody h4{color:var(--acc)}
.trole > summary .chev{width:16px;height:16px;color:var(--faint);margin-top:4px;transition:transform .2s}
.trole[open] > summary .chev{transform:rotate(90deg);color:var(--acc)}
.titems{margin:0 0 12px 184px}
.titems ul.bul,.tbody ul.bul{margin:6px 0 0;list-style:none;color:var(--body);font-size:.94rem}
ul.bul li{padding-left:16px;position:relative;margin-bottom:3px}
ul.bul li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--faint)}
@media(max-width:700px){
  .tl2::before{left:10px}
  .trole > summary,.trole > .thead{grid-template-columns:24px 1fr 20px}
  .tdate{grid-column:2;grid-row:2;text-align:left;padding:2px 0 0}
  .tdot{grid-column:1;grid-row:1;margin-left:5px}
  .tbody{grid-column:2;grid-row:1}
  .trole > summary .chev{grid-column:3;grid-row:1}
  .titems{margin-left:24px}
  .company{flex-direction:column;align-items:flex-start;gap:12px}
  .company small{flex-wrap:wrap}
  .card{padding:22px}
}
/* prévia + ações do projeto */
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.pbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:.86rem;font-weight:600;color:var(--txt);cursor:pointer;transition:.15s}
.pbtn:hover{border-color:var(--hover);background:var(--soft)}
.pbtn .ic{width:16px;height:16px}
.pbtn .chev{transition:transform .2s}
.pbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pmore{margin-top:12px}
.pmore[hidden]{display:none}
.lb{position:fixed;inset:0;z-index:50;background:rgba(14,14,18,.92);display:flex;align-items:center;justify-content:center;padding:60px 70px;backdrop-filter:blur(4px)}
.lb[hidden]{display:none}
.lb figure{max-width:1400px;width:100%;text-align:center}
.lb img{max-width:100%;max-height:78vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);background:#fff}
.lb figcaption{color:#c9c9d1;font-size:.88rem;margin-top:14px}
.lb button{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb button:hover{background:rgba(255,255,255,.14)}
.lbx{top:18px;right:18px}.lbp{left:16px;top:50%;margin-top:-22px}.lbn{right:16px;top:50%;margin-top:-22px}
@media(max-width:700px){.lb{padding:60px 12px}.lbp,.lbn{top:auto;bottom:18px;margin:0}.lbp{left:calc(50% - 54px)}.lbn{right:calc(50% - 54px)}}

/* details aninhados */
details.dd{border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--surface);transition:background .2s}
details.dd[open]{background:var(--bg)}
details.dd > summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:10px;user-select:none}
details.dd > summary::-webkit-details-marker{display:none}
details.dd > summary .chev{transition:transform .2s;color:var(--faint);width:16px;height:16px}
details.dd[open] > summary .chev{transform:rotate(90deg);color:var(--acc)}
details.dd > summary small{color:var(--faint);font-weight:500;margin-left:auto;font-size:.78rem}
details.dd .in{padding:0 16px 16px 42px;color:var(--body);font-size:.92rem}
details.dd .in > p{margin-bottom:6px}
details.dd .in > ul{margin:2px 0 8px 16px}
details.dd .in > ul li{margin-bottom:3px}
details.dd details.dd{background:var(--surface)}
details.dd details.dd .in{padding-left:42px}

/* arquitetura */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;margin:8px 0 4px}
.node{flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:130px}
.node b{display:block;font-size:.82rem;font-weight:600;color:var(--txt);margin-bottom:2px}
.node span{font-size:.8rem;color:var(--mut);line-height:1.45;display:block}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--faint);padding:0 6px}
@media(max-width:700px){.flow{flex-direction:column}.arrow{transform:rotate(90deg);padding:4px 0}}
.ctx .row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.ctx .row:first-child{border-top:0;padding-top:2px}
.ctx .row b{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;padding-top:3px}
.ctx .row ul{margin:0 0 0 16px}
.ctx .row li{margin-bottom:2px}
details.dd .in.ctx{padding-left:42px}
@media(max-width:640px){.ctx .row{grid-template-columns:1fr;gap:4px}}
pre.tree{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--body);line-height:1.6}

.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:.9rem;font-weight:600}
.links a{display:inline-flex;align-items:center;gap:6px}
.links a:hover{color:var(--acc)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.grid2 .card{margin:0;padding:24px}
.grid2 h3{font-size:1.02rem;letter-spacing:-.015em}
.org{color:var(--mut);font-size:.88rem;margin-top:2px}
.lab{border-style:dashed;background:transparent}
.subh{font-size:1.15rem;letter-spacing:-.02em;margin:40px 0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid3 .card{margin:0;padding:22px}
.grid3 h3{font-size:1.02rem}

/* contato */
.contact{background:var(--contact);color:#fff;border:1px solid var(--line);border-radius:28px;padding:56px 40px;text-align:center;margin:20px 0 60px}
.contact h2{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.04em}
.contact p{color:var(--contact-mut);margin:10px auto 30px;max-width:460px}
.cgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cgrid a{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:.92rem;font-weight:500;transition:.18s}
.cgrid a:hover{background:rgba(255,255,255,.14)}
footer{text-align:center;color:var(--faint);font-size:.82rem;padding:0 0 40px}

.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

const ym = v => v.split("-").map(Number);

const nMeses = ([a1, m1], [a2, m2]) => (a2 - a1) * 12 + (m2 - m1) + 1;

function totalEmpresa(e) {
  const ini = e.funcoes.map(f => ym(f.inicio)).sort((x, y) => x[0] - y[0] || x[1] - y[1])[0];
  const fim = e.funcoes.map(f => f.fim ? ym(f.fim) : hoje()).sort((x, y) => y[0] - x[0] || y[1] - x[1])[0];
  return dur(nMeses(ini, fim));
}
const chips = (arr, cls = "") => `<div class="chips">${arr.map(t => `<span class="chip ${cls}">${E(t)}</span>`).join("")}</div>`;
const simpleCard = f => `
  <div class="card reveal">
    <div class="card-top"><h3>${E(f.titulo)}</h3><span class="when">${E(f.periodo)}</span></div>
    <div class="org">${E(f.inst)}</div>${f.texto ? `<p class="sum" style="margin:8px 0 0">${E(f.texto)}</p>` : ""}
  </div>`;

function render() {
  const u = T();
  document.documentElement.lang = { pt: "pt-BR", en: "en", es: "es" }[lang];
  document.querySelectorAll("[data-i]").forEach(el => { el.innerHTML = u[el.dataset.i]; });
  document.querySelectorAll("nav ul a").forEach((a, i) => a.textContent = u.nav[i]);
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("foto").alt = u.foto; $("themeBtn").setAttribute("aria-label", u.tema); $("lbx").setAttribute("aria-label", u.fechar);
  $("menuBtn").setAttribute("aria-label", u.menu); $("lbp").setAttribute("aria-label", u.anterior); $("lbn").setAttribute("aria-label", u.proxima);
  narUI();

  $("stats").innerHTML = DATA.stats.map(s => `<div class="stat"><b>${E(s.n)}</b><span>${E(s.t)}</span></div>`).join("");
  $("skills").innerHTML = DATA.skills.map(s => `<div class="skill"><h3>${E(s.area)}</h3>${chips(s.itens, s.cls ? "acc" : "")}</div>`).join("");

  $("exp").innerHTML = DATA.experiencias.map(e => `
    <div class="card reveal">
      <div class="company">
        ${e.logo ? `<div class="clogo"><img src="${esc(e.logo)}" alt="${E(e.org)}"></div>` : ""}
        <div><h3>${E(e.org)}</h3><small>${ic("pin")}${E(e.local)}<span style="margin:0 4px">·</span>${totalEmpresa(e)}</small></div>
      </div>
      <div class="tl2">${e.funcoes.map(role).join("")}</div>
    </div>`).join("");

  $("proj").innerHTML = DATA.projetos.map((p, i) => `
    <div class="card reveal">
      <div class="card-top">
        <h3>${E(p.nome)}${L(p.status) ? `<em class="badge">${E(p.status)}</em>` : ""}</h3>
        <span class="when">${E(p.ano)}</span>
      </div>
      <p class="sum">${E(p.resumo)}</p>
      ${chips(p.tags)}
      <div class="pact">
        <button class="pbtn" aria-expanded="false" data-more="${i}"><svg class="ic chev"><use href="#i-chev"/></svg><span>${u.verDet}</span></button>
        ${p.previas?.length ? `<button class="pbtn" data-prev="${i}">${ic("eye")}${u.previa}</button>` : ""}
        ${(p.links || []).map(l => `<a class="pbtn" href="${esc(l.u)}" target="_blank" rel="noopener">${E(l.t)}${ic("arrow")}</a>`).join("")}
      </div>
      <div class="pmore" id="more-${i}" hidden>${p.detalhes.map(secao).join("")}</div>
    </div>`).join("");

  $("labs").innerHTML = DATA.lab.map(l => `
    <div class="card lab reveal">
      <h3>${E(l.titulo)}<em class="badge">${E(l.tag)}</em></h3>
      <p class="sum" style="margin-bottom:14px">${E(l.texto)}</p>${chips(l.chips)}
    </div>`).join("");

  $("edu").innerHTML = DATA.formacao.map(simpleCard).join("");
  $("langs").innerHTML = DATA.idiomas.map(f => `
    <div class="card reveal"><h3>${E(f.titulo)}</h3><div class="org">${E(f.inst)}</div>${f.texto ? `<p class="sum" style="margin:8px 0 0">${E(f.texto)}</p>` : ""}</div>`).join("");
  $("vol").innerHTML = DATA.voluntariado.map(simpleCard).join("");
  $("contacts").innerHTML = DATA.contato.map(c => `<a href="${esc(c.u)}" target="_blank" rel="noopener">${ic(c.i)}${E(c.t)}</a>`).join("");
  $("y").textContent = new Date().getFullYear();
  document.querySelectorAll('a[target="_blank"]').forEach(a => { a.querySelector(".sr")?.remove(); a.insertAdjacentHTML("beforeend", `<span class="sr"> ${u.novaAba}</span>`); });
  observe();
}

/* animação de entrada */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); } }), { threshold: .08 }) : null;
let rendered = false;
function observe() {
  document.querySelectorAll(".reveal:not(.on)").forEach(el => (io && !rendered) ? io.observe(el) : el.classList.add("on"));
  rendered = true;
}

/* idioma */
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => { narStop(); lang = b.dataset.lang; store.set("lang", lang); render(); });

/* menu no celular */
$("menuBtn").onclick = () => { const ul = $("navlist"), o = ul.classList.toggle("open"); $("menuBtn").setAttribute("aria-expanded", o); };
$("navlist").addEventListener("click", e => { if (e.target.closest("a")) { $("navlist").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); } });

/* narração (leitura em voz alta do navegador) */
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let narrando = false, narSec = null;
function narUI() {
  const b = $("narBtn"); if (!synth) return; b.hidden = false;
  const geral = narrando && !narSec;
  b.setAttribute("aria-pressed", geral);
  b.querySelector("span").textContent = geral ? T().parar : T().ouvir;
  b.querySelector("use").setAttribute("href", geral ? "#i-stop" : "#i-audio");
  document.querySelectorAll(".lsn").forEach(x => {
    const on = narrando && narSec === x.dataset.sec;
    x.hidden = false; x.classList.toggle("on", on);
    x.setAttribute("aria-label", on ? T().parar : T().ouvirSec); x.title = x.getAttribute("aria-label");
    x.querySelector("use").setAttribute("href", on ? "#i-stop" : "#i-audio");
  });
}
function narStop() { if (synth) synth.cancel(); narrando = false; narSec = null; narUI(); }
function narrar(secs, id) {
  const partes = secs.map(sec => sec.innerText).join("\n").split(/(?<=[.!?])\s+|\n+/).map(t => t.trim()).filter(t => t.length > 1);
  const code = { pt: "pt-BR", en: "en-US", es: "es-ES" }[lang];
  const voz = synth.getVoices().find(v => v.lang.replace("_", "-").toLowerCase().startsWith(code.slice(0, 2)));
  synth.cancel();
  partes.forEach((p, i) => { const ut = new SpeechSynthesisUtterance(p); ut.lang = code; if (voz) ut.voice = voz; if (i === partes.length - 1) ut.onend = () => { narrando = false; narSec = null; narUI(); }; synth.speak(ut); });
  narrando = true; narSec = id || null; narUI();
}
const secoes = () => [...document.querySelectorAll("#main > header, #main > section, #main > #contato")];
$("narBtn").onclick = () => {
  if (!synth) return;
  if (narrando && !narSec) return narStop();
  const secs = secoes();
  let ini = secs.findIndex(sec => sec.getBoundingClientRect().bottom > 90); if (ini < 0) ini = 0;
  narrar(secs.slice(ini));
};
/* botão de ouvir em cada seção */
if (synth) document.querySelectorAll("#main > section, #main > #contato").forEach(sec => {
  const h = sec.querySelector("h2"); if (!h) return;
  const btn = document.createElement("button");
  btn.className = "lsn"; btn.dataset.sec = sec.id; btn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-audio"/></svg>';
  btn.onclick = () => { if (narrando && narSec === sec.id) return narStop(); narrar([sec], sec.id); };
  h.after(btn);
});
narUI();
addEventListener("pagehide", narStop);

/* tema */
function setTheme(t) { document.documentElement.dataset.theme = t; store.set("theme", t); }
$("themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* detalhes + prévia */
let lbList = [], lbIdx = 0;
function lbShow() { const it = lbList[lbIdx]; $("lbimg").src = it.src; $("lbimg").alt = L(it.legenda) || ""; $("lbcap").textContent = `${L(it.legenda) || ""}${lbList.length > 1 ? `  (${lbIdx + 1}/${lbList.length})` : ""}`; $("lbp").hidden = $("lbn").hidden = lbList.length < 2; }
let lbOrigem = null;
function lbClose() { $("lb").hidden = true; document.body.style.overflow = ""; if (lbOrigem) lbOrigem.focus(); }
document.addEventListener("click", ev => {
  const m = ev.target.closest("[data-more]");
  if (m) { const box = $("more-" + m.dataset.more); box.hidden = !box.hidden; m.setAttribute("aria-expanded", !box.hidden); m.querySelector("span").textContent = box.hidden ? T().verDet : T().ocDet; return; }
  const pv = ev.target.closest("[data-prev]");
  if (pv) { lbOrigem = pv; lbList = DATA.projetos[pv.dataset.prev].previas; lbIdx = 0; lbShow(); $("lb").hidden = false; document.body.style.overflow = "hidden"; $("lbx").focus(); return; }
  if (ev.target.id === "lb") lbClose();
});
$("lbx").onclick = lbClose;
$("lbp").onclick = () => { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbShow(); };
$("lbn").onclick = () => { lbIdx = (lbIdx + 1) % lbList.length; lbShow(); };
addEventListener("keydown", ev => { if ($("lb").hidden) return;
  if (ev.key === "Tab") { const f = [...$("lb").querySelectorAll("button")].filter(b => !b.hidden); const i = f.indexOf(document.activeElement); ev.preventDefault(); f[(i + (ev.shiftKey ? -1 : 1) + f.length) % f.length].focus(); return; }
  if (ev.key === "Escape") lbClose(); if (ev.key === "ArrowRight") $("lbn").click(); if (ev.key === "ArrowLeft") $("lbp").click(); });
addEventListener("scroll", () => $("nav").classList.toggle("sc", scrollY > 10), { passive: true });

render();
</script>
